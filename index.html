<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>きょうの服装</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="screen">
    <p class="loading">読み込み中…</p>
  </main>

  <!-- 設定画面 -->
  <dialog id="settings">
    <form method="dialog" class="settings-body">
      <h2>設定</h2>

      <label class="field-label" for="place-query">お住まいの地域</label>
      <p class="current-place" id="current-place"></p>
      <button type="button" id="use-location" class="location-btn">📍 現在地を使う</button>
      <p class="or">または住所で検索</p>
      <div class="search-row">
        <input id="place-query" type="search" placeholder="例: 養老町鷲巣" autocomplete="off">
        <button type="button" id="place-search">検索</button>
      </div>
      <ul id="place-results" class="place-results"></ul>

      <fieldset>
        <legend class="field-label">寒がり・暑がり</legend>
        <div id="sensitivity-choices" class="choices"></div>
      </fieldset>

      <div class="export">
        <span class="field-label">「どうだった？」の記録</span>
        <p class="current-place" id="feedback-count"></p>
        <button type="button" id="export-feedback">記録を送る（書き出し）</button>
        <p class="export-status" id="export-status" role="status"></p>
      </div>

      <p class="privacy">設定と記録はこの端末の中だけに保存されます。現在地は約1kmの精度に丸めて保存します。<br>住所検索: 国土地理院・Open-Meteo</p>
      <button id="settings-close" class="primary" value="close">閉じる</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
